services:
  minecraft-atm10:
    container_name: plan-minecraft-atm10
    security_opt:
      - no-new-privileges:true
    image: itzg/minecraft-server:2026.6.0-java21
    restart: unless-stopped
    mem_limit: 16g
    memswap_limit: 16g
    stop_grace_period: 5m
    tty: true
    stdin_open: true
    expose:
      - "25565"
      - "8804"  # Plan web UI
    environment:
      EULA: "TRUE"
      TYPE: "AUTO_CURSEFORGE"
      CF_API_KEY: "${CF_API_KEY}"
      CF_SLUG: "all-the-mods-10"
      MOTD: "${MOTD}"
      ICON: "${ICON}"
      LEVEL: "${LEVEL}"
      INIT_MEMORY: "${INIT_MEMORY}"
      MAX_MEMORY: "${MAX_MEMORY}"
      DIFFICULTY: "${DIFFICULTY}"
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 10m
      interval: 30s
      retries: 5
    volumes:
      - ./data:/data
      - ./modpacks:/modpacks
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      # Game port (TCP)
      - traefik.tcp.routers.minecraft-atm10.rule=HostSNI(`*`)
      - traefik.tcp.routers.minecraft-atm10.entrypoints=minecraft-atm10
      - traefik.tcp.services.minecraft-atm10.loadbalancer.server.port=25565
      # Plan web UI (HTTP)
      - traefik.http.routers.minecraft-plan-atm10.rule=Host(`${PLAN_DOMAIN:-plan-atmc.${DOMAIN}}`)
      - traefik.http.routers.minecraft-plan-atm10.entrypoints=websecure
      - traefik.http.routers.minecraft-plan-atm10.tls=true
      - traefik.http.routers.minecraft-plan-atm10.tls.certresolver=letsencrypt
      - traefik.http.routers.minecraft-plan-atm10.middlewares=local-only@file
      - traefik.http.services.minecraft-plan-atm10.loadbalancer.server.port=8804
    networks:
      - default
      - web

  minecraft-backup-atm10:
    container_name: minecraft-backup-atm10
    security_opt:
      - no-new-privileges:true
    image: itzg/mc-backup:2026.6.1
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    depends_on:
      minecraft-atm10:
        condition: service_healthy
    stop_grace_period: 5m
    environment:
      SRC_DIR: ${SRC_DIR}
      BK_DIR: ${BK_DIR}
      WEB_HOST: ${WEB_HOST}
      WEB_BK: ${WEB_BK}
      BACKUP_INTERVAL: "2h"
      BACKUP_KEEP_COUNT: "2"
      RCON_HOST: minecraft-atm10
      PRE_BACKUP_SCRIPT: /scripts/pre-backup.sh
      POST_BACKUP_SCRIPT_FILE: /scripts/post-backup.sh
      INITIAL_DELAY: 0
      PAUSE_IF_NO_PLAYERS: "true"
    volumes:
      - ./data:/data
      - ./mc-backups:/backups
      - ./scripts/post-backup.sh:/scripts/post-backup.sh:ro
      - ./scripts/pre-backup.sh:/scripts/pre-backup.sh:ro
      - ./infra/ssh:/root/.ssh:ro

networks:
  web:
    external: true
    name: web
