  # lifecycle only) for host-side automation that shouldn't hold docker.sock.
  - path: ./docker-socket-proxy/docker-compose.yml
  - path: ./vm-lab/docker-compose.yml
    env_file: ./vm-lab/.env
  # Was running under a standalone `open-webui` compose project until
  # 2026-08-14 (someone ran compose from inside services/open-webui/), so the
  # services stack never managed it and it survived reboots only on its restart
  # policy. Now in the stack proper.
  - path: ./open-webui/docker-compose.yml
    env_file: ./open-webui/.env
  - path: ./offline/docker-compose.yml

networks:
  web:
    name: web
