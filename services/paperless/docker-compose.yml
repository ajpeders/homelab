services:
  paperless-broker:
    container_name: paperless-broker
    security_opt:
      - no-new-privileges:true
    image: redis:7.4.9
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ../../state/paperless/redis:/data

  paperless-db:
    container_name: paperless-db
    security_opt:
      - no-new-privileges:true
    image: postgres:16.14
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD}
    volumes:
      - ../../state/paperless/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless"]
      interval: 5s
      retries: 10

  paperless:
    container_name: paperless
    image: ghcr.io/paperless-ngx/paperless-ngx:2.20.15
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 1500m
    memswap_limit: 1500m
    depends_on:
      paperless-broker:
        condition: service_started
      paperless-db:
        condition: service_healthy
    environment:
      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD}
      PAPERLESS_URL: https://${PAPERLESS_DOMAIN:-paperless.${DOMAIN}}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_TIME_ZONE: ${TZ:-UTC}
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-admin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD}
    volumes:
      - ../../state/paperless/data:/usr/src/paperless/data
      - ../../state/paperless/media:/usr/src/paperless/media
      - ${PAPERLESS_EXPORT_PATH:-${SHARE_DIR:?set SHARE_DIR in services/.env}/paperless}:/usr/src/paperless/export
      - ../../state/paperless/consume:/usr/src/paperless/consume
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.paperless.rule=Host(`${PAPERLESS_DOMAIN:-paperless.${DOMAIN}}`)
      - traefik.http.routers.paperless.entrypoints=websecure
      - traefik.http.routers.paperless.tls=true
      - traefik.http.routers.paperless.tls.certresolver=letsencrypt
      - traefik.http.routers.paperless.middlewares=local-only@file
      - traefik.http.services.paperless.loadbalancer.server.port=8000
    networks:
      - web
      - default

networks:
  web:
    external: true
    name: web
