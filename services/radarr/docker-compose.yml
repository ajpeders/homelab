services:
  radarr:
    container_name: radarr
    security_opt:
      - no-new-privileges:true
    image: lscr.io/linuxserver/radarr:6.2.1
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      PUID: ${PUID:?set PUID in services/.env}
      PGID: ${PGID:?set PGID in services/.env}
      TZ: ${TZ:-UTC}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ../../state/radarr:/config
      - ${RADARR_MEDIA_PATH:-${SHARE_DIR:?set SHARE_DIR in services/.env}/media}:/data
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.radarr.rule=Host(`${RADARR_DOMAIN:-radarr.${DOMAIN}}`)
      - traefik.http.routers.radarr.entrypoints=websecure
      - traefik.http.routers.radarr.tls=true
      - traefik.http.routers.radarr.tls.certresolver=letsencrypt
      - traefik.http.routers.radarr.middlewares=local-only@file
      - traefik.http.services.radarr.loadbalancer.server.port=7878
    networks:
      web:
        # Pinned so Prowlarr (in gluetun netns, can't resolve Docker DNS) has a
        # stable baseUrl that survives container recreate.
        ipv4_address: 172.28.0.232

networks:
  web:
    external: true
    name: web
