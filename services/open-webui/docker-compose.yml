services:
  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    mem_limit: 3g
    memswap_limit: 3g
    security_opt:
      - no-new-privileges:true
    env_file: ./.env
    environment:
      # Any OpenAI-compatible endpoint (llama.cpp/llama-swap, vLLM, Ollama's /v1).
      ENABLE_OLLAMA_API: "false"
      OPENAI_API_BASE_URL: ${OPENWEBUI_LLM_URL:?set OPENWEBUI_LLM_URL in services/.env}
      OPENAI_API_KEY: none
      WEBUI_URL: https://${OPENWEBUI_DOMAIN:-llmchat.${DOMAIN}}
      TZ: ${TZ:-UTC}
    volumes:
      - ../../state/open-webui:/app/backend/data
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.open-webui.rule=Host(`${OPENWEBUI_DOMAIN:-llmchat.${DOMAIN}}`)
      - traefik.http.routers.open-webui.entrypoints=websecure
      - traefik.http.routers.open-webui.tls=true
      - traefik.http.routers.open-webui.tls.certresolver=letsencrypt
      - traefik.http.routers.open-webui.middlewares=local-only@file
      - traefik.http.services.open-webui.loadbalancer.server.port=8080
    networks:
      - web

networks:
  web:
    external: true
    name: web
