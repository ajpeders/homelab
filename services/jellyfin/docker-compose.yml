services:
  jellyfin:
    container_name: jellyfin
    security_opt:
      - no-new-privileges:true
    image: jellyfin/jellyfin:10.10.7
    restart: unless-stopped
    mem_limit: 3g
    memswap_limit: 3g
    environment:
      TZ: ${TZ:-UTC}
      JELLYFIN_PublishedServerUrl: https://${JELLYFIN_DOMAIN:-jellyfin.${DOMAIN}}
    volumes:
      - ../../state/jellyfin/config:/config
      - ../../state/jellyfin/cache:/cache
      - ${JELLYFIN_MEDIA_PATH:-${SHARE_DIR:?set SHARE_DIR in services/.env}/media}:/data:ro
    ports:
      - "32400:8096/tcp"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "988"
      - "984"
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.jellyfin.rule=Host(`${JELLYFIN_DOMAIN:-jellyfin.${DOMAIN}}`)
      - traefik.http.routers.jellyfin.entrypoints=websecure
      - traefik.http.routers.jellyfin.tls=true
      - traefik.http.routers.jellyfin.tls.certresolver=letsencrypt
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096
    networks:
      - web

networks:
  web:
    external: true
    name: web
