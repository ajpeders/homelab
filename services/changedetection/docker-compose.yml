services:
  changedetection:
    container_name: changedetection
    security_opt:
      - no-new-privileges:true
    image: ghcr.io/dgtlmoon/changedetection.io:0.55.7
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      BASE_URL: https://${CHANGEDETECTION_DOMAIN:-changes.${DOMAIN}}
      PLAYWRIGHT_DRIVER_URL: ws://changedetection-chrome:3000
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:5000').read()\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ../../state/changedetection:/datastore
    depends_on:
      - changedetection-chrome
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.changedetection.rule=Host(`${CHANGEDETECTION_DOMAIN:-changes.${DOMAIN}}`)
      - traefik.http.routers.changedetection.entrypoints=websecure
      - traefik.http.routers.changedetection.tls=true
      - traefik.http.routers.changedetection.tls.certresolver=letsencrypt
      - traefik.http.routers.changedetection.middlewares=local-only@file
      - traefik.http.services.changedetection.loadbalancer.server.port=5000
    networks:
      - web
      - default

  changedetection-chrome:
    container_name: changedetection-chrome
    security_opt:
      - no-new-privileges:true
    image: browserless/chrome@sha256:57d19e414d9fe4ae9d2ab12ba768c97f38d51246c5b31af55a009205c136012f
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      SCREEN_WIDTH: 1920
      SCREEN_HEIGHT: 1080
      SCREEN_DEPTH: 16
      MAX_CONCURRENT_SESSIONS: 10
      CONNECTION_TIMEOUT: 300000

networks:
  web:
    external: true
    name: web
