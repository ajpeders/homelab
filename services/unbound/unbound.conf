server:
  verbosity: 1
  interface: 0.0.0.0
  port: 53
  do-ip4: yes
  do-ip6: no            # Docker web network is IPv4-only; avoids recursion timeouts on AAAA glue
  do-udp: yes
  do-tcp: yes

  # Only allow queries from Docker internal network
  access-control: 127.0.0.1/32 allow
  access-control: 172.16.0.0/12 allow
  access-control: 0.0.0.0/0 refuse

  # Privacy
  hide-identity: yes
  hide-version: yes
  qname-minimisation: yes

  # Performance
  num-threads: 2
  cache-min-ttl: 300
  cache-max-ttl: 86400
  prefetch: yes
  prefetch-key: yes

  # Refuse iCloud Private Relay discovery (Apple-documented opt-out signal).
  # Relay'd Safari traffic arrives from Akamai/Cloudflare egress IPs, which the
  # local-only middleware 403s — NXDOMAIN here makes iOS disable Relay on this
  # network instead of breaking every *.<DOMAIN> PWA each morning.
  # The two names Apple documents are NOT the ones current iOS actually resolves:
  # AdGuard's query log shows the phone asking only for mask-api.icloud.com and
  # apple-native-relay.mask.apple-dns.net, so the documented pair alone is a
  # silent no-op. Block the config API, which is what the device needs before it
  # can bring Relay up, and it falls back to a direct connection.
  #
  # Do NOT add mask.apple-dns.net here. That is the relay *data path*, not a
  # setup step: NXDOMAIN on it leaves iOS still believing Relay is available but
  # unable to reach it, so Safari fails every request at the network layer. The
  # tell is a PWA whose cached shell still renders while every API call dies with
  # a fetch network error ("Connection lost"), not an HTTP status. Tried and
  # reverted 2026-09-21.
  local-zone: "mask.icloud.com." always_nxdomain
  local-zone: "mask-h2.icloud.com." always_nxdomain
  local-zone: "mask-api.icloud.com." always_nxdomain

  # DNSSEC validation. Trust anchor is bootstrapped by the image entrypoint
  # (unbound-anchor) and kept fresh via RFC 5011 autotrust in the _unbound-writable var/.
  module-config: "validator iterator"
  auto-trust-anchor-file: "/opt/unbound/etc/unbound/var/root.key"

# Recursive resolver: query the root servers directly (built-in root hints).
# No forward-zone — we are our own resolver, no dependency on any upstream.
