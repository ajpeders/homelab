services:
  sonarr:
    container_name: sonarr
    security_opt:
      - no-new-privileges:true
    image: lscr.io/linuxserver/sonarr:4.0.17
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      PUID: ${PUID:?set PUID in services/.env}
      PGID: ${PGID:?set PGID in services/.env}
      TZ: ${TZ:-UTC}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ../../state/sonarr:/config
      - ${SONARR_MEDIA_PATH:-${SHARE_DIR:?set SHARE_DIR in services/.env}/media}:/data
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.sonarr.rule=Host(`${SONARR_DOMAIN:-sonarr.${DOMAIN}}`)
      - traefik.http.routers.sonarr.entrypoints=websecure
      - traefik.http.routers.sonarr.tls=true
      - traefik.http.routers.sonarr.tls.certresolver=letsencrypt
      - traefik.http.routers.sonarr.middlewares=local-only@file
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
    networks:
      web:
        # Pinned so Prowlarr (in gluetun netns, can't resolve Docker DNS) has a
        # stable baseUrl that survives container recreate.
        ipv4_address: 172.28.0.231

networks:
  web:
    external: true
    name: web
