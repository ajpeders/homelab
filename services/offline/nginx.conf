# Fallback "service offline" page. Traefik's file-provider `offline` router
# (dynamic.yml) sends any *.<DOMAIN> host with no live backend here, so
# a down service shows this instead of a confusing redirect.
# Every request returns 503 with the offline page body.
server {
    listen 80 default_server;
    root /usr/share/nginx/html;

    error_page 503 /offline.html;

    location / {
        return 503;
    }

    # Served only as the 503 error body, not directly reachable.
    location = /offline.html {
        internal;
        add_header Cache-Control "no-store" always;
    }
}
