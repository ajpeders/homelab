services:
  traefik:
    container_name: traefik
    security_opt:
      - no-new-privileges:true
    image: traefik:v3.7.5
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      - DOCKER_API_VERSION=1.44
      # Read by dynamic.yml's {{ env "DOMAIN" }} templates (file provider).
      - DOMAIN=${DOMAIN}
      - LAN_IPV6_PREFIX=${LAN_IPV6_PREFIX:-}
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
      # Keep DNS-01 challenges in the Cloudflare-managed zone instead of
      # following the public wildcard CNAME into ddns.net.
      - LEGO_DISABLE_CNAME_SUPPORT=true
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # Apply baseline security headers to every websecure router (defined in
      # dynamic.yml). Harmless on internal routers; covers all public ones.
      - --entrypoints.websecure.http.middlewares=security-headers@file
      - --entrypoints.minecraft.address=:25565
      - --entrypoints.minecraft-atm10.address=:25566
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
      # Access log to a host file (in addition to being parseable) so fail2ban
      # can tail it. JSON format = robust field parsing for the jail filter.
      - --accesslog=true
      - --accesslog.filepath=/var/log/traefik/access.log
      - --accesslog.format=json
      # Keep User-Agent only; all other request headers stay dropped. Without it
      # the log has no way to tell a browser from a scanner except by path.
      - --accesslog.fields.headers.names.User-Agent=keep
      - --ping=true
      - --entrypoints.websecure.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,127.0.0.1/32
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "80:80"
      - "443:443"
      - "25565:25565"
      - "25566:25566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ../../state/traefik/acme.json:/etc/traefik/acme/acme.json
      - ../../state/traefik/logs:/var/log/traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`${TRAEFIK_DASHBOARD_DOMAIN:-traefik.${DOMAIN}}`)
      - traefik.http.routers.traefik.entrypoints=websecure
      - traefik.http.routers.traefik.tls=true
      - traefik.http.routers.traefik.tls.certresolver=letsencrypt
      - traefik.http.routers.traefik.middlewares=local-only@file
      - traefik.http.routers.traefik.service=api@internal
    networks:
      - web


networks:
  web:
    external: true
    name: web
