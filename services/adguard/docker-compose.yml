services:
  adguard:
    container_name: adguard
    security_opt:
      - no-new-privileges:true
    image: adguard/adguardhome:v0.107.77
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    volumes:
      - ../../state/adguard/work:/opt/adguardhome/work
      - ../../state/adguard/conf:/opt/adguardhome/conf
    ports:
      - "${LAN_BIND_IP:-${LAN_IP:?set LAN_IP in services/.env}}:53:53/tcp"
      - "${LAN_BIND_IP:-${LAN_IP:?set LAN_IP in services/.env}}:53:53/udp"
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.adguard.rule=Host(`${ADGUARD_DOMAIN:-adguard.${DOMAIN}}`)
      - traefik.http.routers.adguard.entrypoints=websecure
      - traefik.http.routers.adguard.tls=true
      - traefik.http.routers.adguard.tls.certresolver=letsencrypt
      - traefik.http.routers.adguard.middlewares=local-only@file
      - traefik.http.services.adguard.loadbalancer.server.port=3001
    networks:
      web:
        ipv4_address: 172.28.0.53

networks:
  web:
    external: true
    name: web
