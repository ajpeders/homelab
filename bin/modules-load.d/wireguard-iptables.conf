# Legacy iptables kernel modules for the wg-easy container.
#
# wg-quick inside wg-easy uses iptables-legacy for its NAT/forward rules, which
# needs these modules in the HOST kernel — the container deliberately has no
# /lib/modules and no CAP_SYS_MODULE, so it cannot load them itself
# (modprobe: FATAL: Module ip_tables not found ... wg-quick up exits 3, and the
# VPN comes up with no interface at all).
#
# This bit on the 2026-08-27 reboot: the previous boot had them loaded as a
# side effect, the fresh kernel (7.1.9) booted without them, and WireGuard was
# down for every peer until they were modprobed by hand.
#
# Install: sudo cp bin/modules-load.d/wireguard-iptables.conf /etc/modules-load.d/
ip_tables
iptable_nat
iptable_filter
ip6_tables
ip6table_nat
ip6table_filter
