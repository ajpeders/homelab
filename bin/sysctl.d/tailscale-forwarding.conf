# IP forwarding for the Tailscale subnet router / exit node.
#
# Without this, `tailscale up --advertise-routes=...` still registers the route
# and the tailnet still shows it as available — packets just get dropped. The
# failure looks like "some LAN hosts are unreachable", not like a missing
# setting, so set it explicitly rather than relying on Docker having flipped
# ip_forward at runtime (Docker does, but nothing persists it, and a boot where
# Docker starts late leaves a window with routing dead).
#
# Install: sudo cp bin/sysctl.d/tailscale-forwarding.conf /etc/sysctl.d/ \
#          && sudo sysctl --system
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
