# fail2ban filter — Traefik JSON access log.
# Matches requests that returned 401 (failed auth) or 403 (blocked, incl.
# local-only IP denials) so repeat offenders get banned. 404s are intentionally
# NOT matched: legit apps 404 constantly and it would false-positive.
#
# Install: sudo cp bin/fail2ban/traefik-auth.conf /etc/fail2ban/filter.d/
# Field: Traefik JSON logs the real client as "ClientHost" (XFF-resolved when
# behind a trusted proxy; direct peer otherwise).
[Definition]
failregex = "ClientHost":"<HOST>".*"DownstreamStatus":(401|403)
ignoreregex =
